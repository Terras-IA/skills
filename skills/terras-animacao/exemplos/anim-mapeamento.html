<!-- Animação do post de mapeamento (BPMN, identidade do produto).
     Dirigida por ?t=<ms>: o JS desenha o frame daquele instante (determinístico).
     Render: python3 render-anim.py quadro anim-mapeamento.html 2400 q.png
             python3 render-anim.py animar anim-mapeamento.html --saida anim-mapeamento --capa 5600
     Linha do tempo: fluxo se desenha (0.4-1.6s) > jeitinho aparece (1.6-2.6s)
     > retrabalho + tremor (2.5-3.3s) > legenda (3.4-3.8s) > respiro até 6.4s. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "JetBrains Mono";
    src: url("file:///home/support/Documents/Diversos/terras-brand/fonts/jetbrains-mono-latin.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 628px; overflow: hidden; position: relative;
    background: #060a12; color: #e8edf2;
    font-family: "Ubuntu Sans", Ubuntu, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .cabecalho { position: absolute; top: 42px; left: 56px; right: 56px;
    display: flex; justify-content: space-between; align-items: center; }
  .logo { height: 38px; display: block; }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 14px; letter-spacing: .28em;
    color: #22d3ee; text-transform: uppercase; padding-bottom: 7px;
    border-bottom: 2px solid #22d3ee; }
  h1 { position: absolute; left: 56px; top: 100px; font-weight: 600;
    font-size: 50px; letter-spacing: -0.022em; }
  h1 .ciano { color: #22d3ee; }
  #mapa { position: absolute; left: 56px; top: 200px; width: 1088px; height: 380px; }
  #legenda { position: absolute; left: 56px; bottom: 20px; font-size: 30px;
    font-weight: 600; letter-spacing: -0.01em; }
  .assinatura { position: absolute; right: 56px; bottom: 14px; text-align: right;
    font-family: "JetBrains Mono", monospace; color: #94a3b8; }
  .pontos { font-size: 12px; letter-spacing: .5em; margin-bottom: 3px; }
  .site { font-size: 14px; letter-spacing: .06em; }

  /* estilos do SVG */
  .seta { stroke: #22d3ee; stroke-width: 3; fill: none; stroke-linecap: round; }
  .forma { fill: none; stroke: #22d3ee; stroke-width: 3; }
  .fim { stroke-width: 5; }
  .tarefa { font-family: "Ubuntu Sans", Ubuntu, sans-serif; font-weight: 600;
    font-size: 30px; fill: #e8edf2; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .pool-txt { font-family: "JetBrains Mono", monospace; font-size: 16px;
    letter-spacing: .18em; fill: #94a3b8; }
  .fila-txt { font-family: "JetBrains Mono", monospace; font-size: 17px;
    letter-spacing: .14em; fill: #f0e000; }
  .xor { font-family: "JetBrains Mono", monospace; font-size: 26px; fill: #22d3ee; }
  .red { stroke: #ff2a2a; stroke-width: 2.5; fill: none; }
  .traco { stroke-dasharray: 10 8; }
  .caixa-red { stroke: #ff2a2a; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; }
  .red-txt { font-family: "JetBrains Mono", monospace; font-size: 26px;
    letter-spacing: .08em; fill: #ff2a2a; }
  .refazer-txt { font-family: "JetBrains Mono", monospace; font-size: 20px;
    letter-spacing: .12em; fill: #ff2a2a; }
  .jeitinho-txt { font-family: "JetBrains Mono", monospace; font-size: 22px;
    letter-spacing: .16em; fill: #ff2a2a; }
  .ponta-c { fill: #22d3ee; }
  .ponta-r { fill: #ff2a2a; }
  .ponteiro { stroke: #f0e000; stroke-width: 2.5; stroke-linecap: round; }
  .pulso { fill: none; stroke: #f0e000; stroke-width: 2; }
</style>
</head>
<body>
  <div class="cabecalho">
    <img class="logo" src="file:///srv/harness/terrasia-site/identidade/ativos/logo-claro.png" alt="terrasIA">
    <div class="tag">Mapeamento de processos</div>
  </div>
  <h1 id="manchete">O processo <span class="ciano">real</span> não está no SOP.</h1>

  <svg id="mapa" viewBox="0 0 1088 380">
    <g id="tremor">
      <!-- pool -->
      <g id="pool" style="opacity:0">
        <rect x="8" y="46" width="1072" height="168" fill="none" stroke="#1a2433" stroke-width="2"/>
        <line x1="78" y1="46" x2="78" y2="214" stroke="#1a2433" stroke-width="2"/>
        <text class="pool-txt" x="43" y="130" transform="rotate(-90 43 130)" text-anchor="middle">OPERAÇÃO</text>
      </g>

      <!-- fluxo principal (o "SOP") -->
      <g id="gInicio" style="opacity:0"><circle class="forma" cx="104" cy="130" r="22"/></g>
      <path id="a1" class="seta" d="M126 130 H169"/>
      <polygon id="p1" class="ponta-c" points="0,0 -13,-6 -13,6" transform="translate(169 130)" style="opacity:0"/>
      <g id="gSolicitar" style="opacity:0">
        <rect class="forma" x="169" y="88" width="270" height="84" rx="12"/>
        <text class="tarefa" x="304" y="141" text-anchor="middle">Solicitar</text>
      </g>
      <path id="a2" class="seta" d="M439 130 H474"/>
      <polygon id="p2" class="ponta-c" points="0,0 -13,-6 -13,6" transform="translate(474 130)" style="opacity:0"/>
      <g id="gTimer" style="opacity:0">
        <circle class="pulso" id="pulso" cx="504" cy="130" r="30" style="display:none"/>
        <circle class="forma" cx="504" cy="130" r="30" style="stroke:#f0e000"/>
        <circle class="forma" cx="504" cy="130" r="24" style="stroke:#f0e000;stroke-width:2"/>
        <line class="ponteiro" x1="504" y1="130" x2="522" y2="130"/>
        <line class="ponteiro" id="ponteiroSeg" x1="504" y1="130" x2="504" y2="104"/>
        <circle cx="504" cy="130" r="2.5" fill="#f0e000"/>
      </g>
      <text id="rotuloFila" class="fila-txt" x="504" y="200" text-anchor="middle" style="opacity:0">FILA</text>
      <path id="a3" class="seta" d="M534 130 H569"/>
      <polygon id="p3" class="ponta-c" points="0,0 -13,-6 -13,6" transform="translate(569 130)" style="opacity:0"/>
      <g id="gGateway" style="opacity:0">
        <polygon class="forma" points="609,90 649,130 609,170 569,130"/>
        <text class="xor" x="609" y="140" text-anchor="middle">×</text>
      </g>
      <path id="a4" class="seta" d="M649 130 H674"/>
      <polygon id="p4" class="ponta-c" points="0,0 -13,-6 -13,6" transform="translate(674 130)" style="opacity:0"/>
      <g id="gLancar" style="opacity:0">
        <rect class="forma" x="674" y="88" width="220" height="84" rx="12"/>
        <text class="tarefa" x="784" y="141" text-anchor="middle">Lançar</text>
      </g>
      <path id="a5" class="seta" d="M894 130 H944"/>
      <polygon id="p5" class="ponta-c" points="0,0 -13,-6 -13,6" transform="translate(944 130)" style="opacity:0"/>
      <g id="gFim" style="opacity:0"><circle class="forma fim" cx="970" cy="130" r="26"/></g>

      <!-- retrabalho (gateway -> Solicitar) -->
      <path id="retrabalho" class="red traco" d="M609 90 C590 18 320 18 304 88" style="opacity:0"/>
      <polygon id="pr" class="ponta-r" points="0,0 -13,-6 -13,6" transform="translate(304 88) rotate(103)" style="opacity:0"/>
      <g id="gRefazer" style="opacity:0">
        <rect x="398" y="22" width="116" height="26" rx="4" fill="#060a12"/>
        <text class="refazer-txt" x="456" y="41" text-anchor="middle">REFAZER</text>
      </g>

      <!-- o jeitinho (fora do sistema) -->
      <path id="con1" class="red traco" d="M414 293 H454" style="opacity:0"/>
      <path id="con2" class="red traco" d="M674 293 H714" style="opacity:0"/>
      <path id="v1" class="red traco" d="M304 255 V178" style="opacity:0"/>
      <polygon id="pv1" class="ponta-r" points="0,0 -13,-6 -13,6" transform="translate(304 178) rotate(-90)" style="opacity:0"/>
      <path id="v2" class="red traco" d="M824 255 V178" style="opacity:0"/>
      <polygon id="pv2" class="ponta-r" points="0,0 -13,-6 -13,6" transform="translate(824 178) rotate(-90)" style="opacity:0"/>
      <g id="gPlanilha" style="opacity:0">
        <rect class="caixa-red" x="194" y="255" width="220" height="76" rx="10"/>
        <text class="red-txt" x="304" y="300" text-anchor="middle">PLANILHA</text>
      </g>
      <g id="gCaderno" style="opacity:0">
        <rect class="caixa-red" x="454" y="255" width="220" height="76" rx="10"/>
        <text class="red-txt" x="564" y="300" text-anchor="middle">CADERNO</text>
      </g>
      <g id="gWhatsapp" style="opacity:0">
        <rect class="caixa-red" x="714" y="255" width="220" height="76" rx="10"/>
        <text class="red-txt" x="824" y="300" text-anchor="middle">WHATSAPP</text>
      </g>
      <text id="rotuloJeitinho" class="jeitinho-txt" x="564" y="247" text-anchor="middle" style="opacity:0">O JEITINHO</text>
    </g>
  </svg>

  <div id="legenda" style="opacity:0">É esse processo que a gente mapeia.</div>
  <div class="assinatura">
    <div class="pontos">&middot;&nbsp;&middot;&nbsp;&middot;&nbsp;&middot;</div>
    <div class="site">terrasia.app</div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const t = params.has("t") ? parseFloat(params.get("t")) : 5600;
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eBack = (p) => { const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (a, b, f) => t <= a ? 0 : t >= b ? 1 : (f || eOut)(clamp01((t - a) / (b - a)));

function some(id, a, b) { $(id).style.opacity = prog(a, b); }
function pop(id, a, b, cx, cy) {
  const el = $(id), p = prog(a, b, eBack);
  el.setAttribute("transform",
    `translate(${cx} ${cy}) scale(${(0.55 + 0.45 * p).toFixed(3)}) translate(${-cx} ${-cy})`);
  el.style.opacity = clamp01(prog(a, b) * 1.8);
}
function seta(linha, ponta, a, b) {
  const el = $(linha), L = el.getTotalLength(), p = prog(a, b);
  el.style.strokeDasharray = `${L}`;
  el.style.strokeDashoffset = `${L * (1 - p)}`;
  el.style.opacity = t >= a ? 1 : 0;
  some(ponta, b - 120, b + 80);
}
function formigas(id) { $(id).style.strokeDashoffset = `${-(((t) / 28) % 18)}`; }

function render() {
  const h = $("manchete"), ph = prog(0, 320);
  h.style.opacity = ph;
  h.style.transform = `translateY(${(1 - ph) * 16}px)`;

  some("pool", 350, 600);
  pop("gInicio", 400, 650, 104, 130);
  seta("a1", "p1", 470, 620);
  pop("gSolicitar", 540, 790, 304, 130);
  seta("a2", "p2", 680, 780);
  pop("gTimer", 750, 1000, 504, 130);
  some("rotuloFila", 820, 1050);
  seta("a3", "p3", 890, 990);
  pop("gGateway", 960, 1210, 609, 130);
  seta("a4", "p4", 1100, 1200);
  pop("gLancar", 1170, 1420, 784, 130);
  seta("a5", "p5", 1310, 1410);
  pop("gFim", 1380, 1630, 970, 130);

  some("con1", 1650, 1850);
  some("con2", 1650, 1850);
  some("v1", 1750, 1950);
  some("v2", 1750, 1950);
  some("pv1", 1830, 2030);
  some("pv2", 1830, 2030);
  pop("gPlanilha", 1900, 2150, 304, 293);
  pop("gCaderno", 2050, 2300, 564, 293);
  pop("gWhatsapp", 2200, 2450, 824, 293);
  some("rotuloJeitinho", 2300, 2550);
  some("retrabalho", 2500, 2750);
  some("pr", 2630, 2830);
  pop("gRefazer", 2700, 2900, 456, 34);

  ["con1", "con2", "v1", "v2", "retrabalho"].forEach(formigas);

  const ang = Math.floor(Math.max(0, t - 750) / 600) * 6;
  $("ponteiroSeg").setAttribute("transform", `rotate(${ang} 504 130)`);

  const pr = $("pulso"), inicio = 800, ciclo = 1600;
  if (t >= inicio) {
    const f = ((t - inicio) % ciclo) / ciclo;
    pr.setAttribute("r", (30 + 18 * f).toFixed(1));
    pr.style.opacity = (0.65 * (1 - f)).toFixed(3);
    pr.style.display = "";
  }

  const dt = t - 2950;
  const dx = (dt > 0 && dt < 300) ? Math.sin(dt / 18) * 3 * (1 - dt / 300) : 0;
  $("tremor").setAttribute("transform", `translate(${dx.toFixed(2)} 0)`);

  const c = $("legenda"), pc = prog(3400, 3800);
  c.style.opacity = pc;
  c.style.transform = `translateY(${(1 - pc) * 14}px)`;
}
document.fonts.ready.then(render);
</script>
</body>
</html>
